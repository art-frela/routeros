name: Go Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23.x", "1.24.x"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go-version == '1.23.x'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

  # Boots a real RouterOS CHR via testcontainers (Docker is preinstalled on
  # ubuntu-latest). Image source: the prebuilt ghcr.io/art-frela/routeros-it-chr:7.23.3
  # (published by .github/workflows/chr-image.yml) is pulled when nothing under
  # test/integration/** changed vs this event's base (fast - no in-CI build);
  # when it did change (or the registry image is not pullable - e.g. the
  # package is still private right after the first publish), the image is
  # built from this commit's own test/integration Dockerfile with the docker
  # CLI - no image/code skew, no race with the push-to-main publish job, and
  # no dependency on the daemon's raw-API BuildKit session support.
  integration:
    name: Integration Tests (RouterOS CHR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 (full history): the "Resolve CHR image source" step below
      # diffs pull requests against github.event.pull_request.base.sha, which a
      # shallow checkout may not contain.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Enable KVM acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM enabled"; else echo "::warning::/dev/kvm not available - CHR will boot under TCG emulation (slower)"; fi

      - name: Resolve CHR image source
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          ARCH=x86_64
          if [ "$(uname -m)" = "aarch64" ]; then ARCH=aarch64; fi
          LOCAL_TAG="routeros-it-chr:7.23.3-${ARCH}"
          GHCR_TAG="ghcr.io/art-frela/routeros-it-chr:7.23.3"

          build_local() {
            # Build with the docker CLI, not the in-test testcontainers build:
            # a BuildKit build through the raw Engine API fails on plain
            # dockerd daemons with "no active sessions" because only the CLI
            # attaches the client-side BuildKit session.
            docker build -t "$LOCAL_TAG" --build-arg ROUTEROS_VERSION=7.23.3 test/integration
            echo "ROUTEROS_IT_IMAGE=${LOCAL_TAG}" >> "$GITHUB_ENV"
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # Full push range (before..after): a multi-commit push must not
            # miss image-affecting changes in earlier commits.
            changed=$(git diff --name-only "$BEFORE_SHA" HEAD)
          else
            # Zero before-sha (branch creation / rewritten history): safest
            # to treat everything as changed.
            changed="test/integration/Dockerfile"
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(test/integration/|\.github/workflows/chr-image\.yml)'; then
            echo "CHR image inputs changed in this event - building this commit's image with the docker CLI."
            build_local
          elif docker pull -q "$GHCR_TAG" 2>/dev/null; then
            echo "CHR image inputs unchanged - using prebuilt GHCR image."
            echo "ROUTEROS_IT_IMAGE=${GHCR_TAG}" >> "$GITHUB_ENV"
          else
            echo "Prebuilt image not pullable (package not published yet or private) - building locally instead."
            build_local
          fi

      - name: Install dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -tags=integration -timeout 25m -v ./...
