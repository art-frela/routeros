name: Go Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23.x", "1.24.x"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go-version == '1.23.x'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.out

  # Boots a real RouterOS CHR via testcontainers (Docker is preinstalled on
  # ubuntu-latest; the GHCR image is public, so no docker login is needed).
  # Image source: the prebuilt ghcr.io/art-frela/routeros-it-chr:7.23.3
  # (published by .github/workflows/chr-image.yml) is pulled when nothing under
  # test/integration/** changed vs this event's base (fast - no in-CI build);
  # when it did change, testcontainers builds the PR's own Dockerfile instead -
  # no image/code skew and no race with the push-to-main publish job.
  integration:
    name: Integration Tests (RouterOS CHR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 (full history): the "Resolve CHR image source" step below
      # diffs pull requests against github.event.pull_request.base.sha, which a
      # shallow checkout may not contain.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Enable KVM acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "KVM enabled"; else echo "::warning::/dev/kvm not available - CHR will boot under TCG emulation (slower)"; fi

      - name: Resolve CHR image source
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD)
          else
            changed=$(git diff --name-only HEAD^ HEAD)
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(test/integration/|\.github/workflows/chr-image\.yml)'; then
            echo "CHR image inputs changed in this event - ROUTEROS_IT_IMAGE left unset;"
            echo "testcontainers will build this commit's own test/integration Dockerfile."
          else
            echo "CHR image inputs unchanged - using prebuilt GHCR image."
            echo "ROUTEROS_IT_IMAGE=ghcr.io/art-frela/routeros-it-chr:7.23.3" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -tags=integration -timeout 25m -v ./...
